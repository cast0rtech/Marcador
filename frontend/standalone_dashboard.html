    function formatDate(dateString, lang) {
      if (!dateString) return null;
      const locale = lang === 'de' ? 'de-DE' : lang === 'es' ? 'es-ES' : 'en-US';
      try {
        return new Date(dateString).toLocaleString(locale, {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      } catch {
        return dateString;
      }
    }

    function StandaloneChart({ data, lang }) {
      const canvasRef = useRef(null);
      const chartInstance = useRef(null);
      const t = i18n[lang] || i18n.en;

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const labels = (data || []).map(d => d.category);
        const counts = (data || []).map(d => d.count);

        const ctx = canvasRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels.length ? labels : ['---'],
            datasets: [{
              label: t.chartTitle,
              data: counts.length ? counts : [0],
              backgroundColor: ['#ef4444', '#06b6d4', '#818cf8', '#f59e0b', '#3b82f6'],
              borderRadius: 6,
              borderWidth: 0,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#1e293b',
                titleColor: '#f8fafc',
                bodyColor: '#94a3b8',
                borderColor: '#334155',
                borderWidth: 1,
                padding: 10,
              }
            },
            scales: {
              x: {
                grid: { color: '#1e293b' },
                ticks: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans' } }
              },
              y: {
                beginAtZero: true,
                grid: { color: '#1e293b' },
                ticks: { color: '#94a3b8', stepSize: 1, font: { family: 'JetBrains Mono' } }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [data, lang]);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-base font-bold text-white flex items-center gap-2">
              📊 {t.chartTitle}
            </h2>
            <span className="text-xs font-mono text-slate-400">Chart.js</span>
          </div>
          <div className="h-56 w-full">
            <canvas ref={canvasRef}></canvas>
          </div>
        </div>
      );
    }

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('bms_lang') || 'en');
      const [summary, setSummary] = useState(null);
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [lastUpdated, setLastUpdated] = useState(new Date());
      const [autoRefresh, setAutoRefresh] = useState(true);
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [uploading, setUploading] = useState(false);
      const [uploadMsg, setUploadMsg] = useState(null);
      const fileInputRef = useRef(null);

      const t = i18n[lang] || i18n.en;

      const changeLanguage = (newLang) => {
        setLang(newLang);
        localStorage.setItem('bms_lang', newLang);
      };

      const loadData = useCallback(async () => {
        try {
          const [resSummary, resEvents] = await Promise.all([
            fetch(`${API_BASE}/dashboard/summary`),
            fetch(`${API_BASE}/api/alarms/history`),
          ]);

          if (resSummary.ok) {
            const sumData = await resSummary.json();
            setSummary(sumData);
          }
          if (resEvents.ok) {
            const evData = await resEvents.json();
            setEvents(evData);
          }
          setLastUpdated(new Date());
        } catch (err) {
          console.error("Error cargando telemetría BMS:", err);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        loadData();
      }, [loadData]);

      // WebSocket Connection
      useEffect(() => {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsHost = window.location.origin.includes('5173') || window.location.origin.includes('3000')
          ? 'localhost:8000'
          : window.location.host;
        
        const wsUrl = `${wsProtocol}//${wsHost}/ws/alarms`;
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => console.log('⚡ WebSocket Conectado:', wsUrl);
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            console.log('📡 Evento WS en Standalone:', data);
            loadData();
          } catch (e) {
            console.error('Error parseando WebSocket payload:', e);
          }
        };

        return () => ws.close();
      }, [loadData]);

      useEffect(() => {
        if (!autoRefresh) return;
        const interval = setInterval(loadData, 5000);
        return () => clearInterval(interval);
      }, [autoRefresh, loadData]);

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        setUploading(true);
        setUploadMsg(null);

        try {
          let token = localStorage.getItem('bms_token');
          const headers = {};
          if (token) {
            headers['Authorization'] = `Bearer ${token}`;
          }

          let res = await fetch(`${API_BASE}/api/points/import`, {
            method: 'POST',
            headers: headers,
            body: formData,
          });

          // Si requiere autorización y no tenemos token o expiró, intentamos auto-login con credenciales por defecto de fábrica
          if (res.status === 401) {
            const loginBody = new URLSearchParams();
            loginBody.append('username', 'root');
            loginBody.append('password', 'Marcadorroot');
            const authRes = await fetch(`${API_BASE}/api/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: loginBody
            });
            if (authRes.ok) {
              const authData = await authRes.json();
              token = authData.access_token;
              localStorage.setItem('bms_token', token);
              headers['Authorization'] = `Bearer ${token}`;
              res = await fetch(`${API_BASE}/api/points/import`, {
                method: 'POST',
                headers: headers,
                body: formData,
              });
            }
          }

          const result = await res.json();
          if (res.ok) {
            setUploadMsg({ type: 'success', text: result.message || t.importSuccess });
            loadData();
          } else {
            setUploadMsg({ type: 'error', text: result.detail || t.importFail });
          }
        } catch (err) {
          setUploadMsg({ type: 'error', text: t.connError });
        } finally {
          setUploading(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      const handleExport = () => {
        window.open(`${API_BASE}/api/points/export`, '_blank');
      };

      const filteredEvents = events.filter(ev => {
        const dp = ev.data_point || ev.datapoint;
        const dpName = dp?.name || `DataPoint #${ev.data_point_id || ev.datapoint_id}`;
        const groupName = dp?.group?.name || dp?.alarm_group?.name || '';
        const notif = ev.notifications?.[0] || ev.notification_logs?.[0];
        const recipient = notif?.recipient || '';

        const matches = dpName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        groupName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        recipient.toLowerCase().includes(searchTerm.toLowerCase());
        if (!matches) return false;

        const evStatus = ev.status || ev.state;
        if (statusFilter === 'ALL') return true;
        if (statusFilter === 'ACTIVE') return evStatus !== 'Resuelta' && evStatus !== 'Resolved';
        if (statusFilter === 'RESOLVED') return evStatus === 'Resuelta' || evStatus === 'Resolved';
        return true;
      });

      const totalActive = summary?.total_active_alarms || 0;

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-20 px-6 py-4">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-3 h-3 rounded-full bg-blue-500 animate-ping"></div>
                <h1 className="text-xl font-bold tracking-tight text-white font-mono">{t.title}</h1>
                <span className="text-xs px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800 font-mono">{t.core}</span>
              </div>
              <div className="flex items-center gap-3">
                {/* Language Switcher */}
                <div className="flex items-center bg-slate-800 border border-slate-700 rounded-lg p-0.5 text-xs font-mono">
                  <button
                    onClick={() => changeLanguage('en')}
                    className={`px-2 py-0.5 rounded ${lang === 'en' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                  >
                    EN
                  </button>
                  <button
                    onClick={() => changeLanguage('de')}
                    className={`px-2 py-0.5 rounded ${lang === 'de' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                  >
                    DE
                  </button>
                  <button
                    onClick={() => changeLanguage('fr')}
                    className={`px-2 py-0.5 rounded ${lang === 'fr' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                  >
                    FR
                  </button>
                  <button
                    onClick={() => changeLanguage('it')}
                    className={`px-2 py-0.5 rounded ${lang === 'it' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                  >
                    IT
                  </button>
                  <button
                    onClick={() => changeLanguage('es')}
                    className={`px-2 py-0.5 rounded ${lang === 'es' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                  >
                    ES
                  </button>
                </div>

                {totalActive > 0 ? (
                  <span className="px-3 py-1 rounded bg-red-950 border border-red-800 text-red-300 text-xs font-bold animate-pulse">
                    🚨 {totalActive} {t.activeAlarmsBadge}
                  </span>
                ) : (
                  <span className="px-3 py-1 rounded bg-emerald-950 border border-emerald-800 text-emerald-300 text-xs font-semibold">
                    ✓ {t.nominalBadge}
                  </span>
                )}
                <button
                  onClick={() => setAutoRefresh(!autoRefresh)}
                  className={`text-xs font-mono px-3 py-1 rounded border ${
                    autoRefresh ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-400 border-slate-700'
                  }`}
                >
                  {autoRefresh ? t.live : t.paused}
                </button>
                <button
                  onClick={loadData}
                  className="text-xs px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-700 text-slate-200"
                >
                  ↻ {t.refresh}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl w-full mx-auto p-6 space-y-6 flex-1">
            {/* KPI Cards */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <span className="text-xs font-mono text-slate-400 uppercase">{t.kpiGroups}</span>
                <p className="text-2xl font-bold font-mono text-white mt-1">{summary?.total_groups ?? 0}</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <span className="text-xs font-mono text-slate-400 uppercase">{t.kpiPoints}</span>
                <p className="text-2xl font-bold font-mono text-white mt-1">{summary?.total_points ?? 0}</p>
              </div>
              <div className={`p-4 rounded-xl border ${totalActive > 0 ? 'bg-red-950/40 border-red-800' : 'bg-slate-900 border-slate-800'}`}>
                <span className="text-xs font-mono text-slate-400 uppercase">{t.kpiActive}</span>
                <p className={`text-2xl font-bold font-mono mt-1 ${totalActive > 0 ? 'text-red-400' : 'text-emerald-400'}`}>
                  {totalActive}
                </p>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <span className="text-xs font-mono text-slate-400 uppercase">{t.kpiPolling}</span>
                <p className="text-xs font-mono text-blue-400 mt-2">{lastUpdated.toLocaleTimeString()}</p>
              </div>
            </div>

            {/* SECCIÓN INTERACTIVA: Importación y Exportación de Puntos */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-5">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h2 className="text-base font-bold text-white flex items-center gap-2">
                    📁 {t.mgmtTitle}
                  </h2>
                  <p className="text-xs text-slate-400">
                    {t.mgmtDesc}
                  </p>
                </div>
                <div className="flex flex-wrap items-center gap-3">
                  <input
                    type="file"
                    ref={fileInputRef}
                    accept=".csv,.xlsx,.xls"
                    onChange={handleFileUpload}
                    className="hidden"
                  />
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    disabled={uploading}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-semibold text-white transition-all disabled:opacity-50 flex items-center gap-2"
                  >
                    <span>{uploading ? t.uploading : `⬆ ${t.btnImport}`}</span>
                  </button>
                  <button
                    onClick={handleExport}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-semibold text-slate-200 transition-all flex items-center gap-2"
                  >
                    <span>⬇ {t.btnExport}</span>
                  </button>
                </div>
              </div>

              {uploadMsg && (
                <div className={`mt-3 p-3 rounded-lg text-xs font-mono flex items-center justify-between ${
                  uploadMsg.type === 'success' ? 'bg-emerald-950 border border-emerald-800 text-emerald-300' : 'bg-red-950 border border-red-800 text-red-300'
                }`}>
                  <span>{uploadMsg.text}</span>
                  <button onClick={() => setUploadMsg(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
              )}
            </div>

            {/* Alarm Groups Status Cards */}
            <div>
              <h2 className="text-base font-bold text-white mb-3">{t.groupsTitle}</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {(summary?.groups || []).map(g => {
                  const isAlarm = g.active_alarms > 0;
                  return (
                    <div
                      key={g.id}
                      className={`p-5 rounded-xl border ${
                        isAlarm ? 'bg-red-950/40 border-red-700 shadow-lg' : 'bg-slate-900 border-slate-800'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-3">
                        <h3 className="font-bold text-white">{g.name}</h3>
                        <span className={`text-xs px-2.5 py-0.5 rounded-full font-semibold ${
                          isAlarm ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                        }`}>
                          {isAlarm ? t.filterActive : 'OK'}
                        </span>
                      </div>
                      <div className="grid grid-cols-2 gap-2 text-xs font-mono bg-slate-950 p-2.5 rounded border border-slate-800">
                        <div>
                          <span className="text-slate-400 block">{t.pointsLabel}</span>
                          <strong className="text-white text-base">{g.total_points}</strong>
                        </div>
                        <div>
                          <span className="text-slate-400 block">{t.alarmsLabel}</span>
                          <strong className={`text-base ${isAlarm ? 'text-red-400' : 'text-slate-400'}`}>{g.active_alarms}</strong>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Chart Section */}
            <StandaloneChart data={summary?.alarms_last_24h || []} lang={lang} />

            {/* Audit DataGrid Table */}
            <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
              <div className="p-4 border-b border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
                <h2 className="text-base font-semibold text-white">{t.auditTitle}</h2>
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    placeholder={t.searchPlaceholder}
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                    className="bg-slate-950 border border-slate-700 text-xs text-white px-3 py-1.5 rounded focus:outline-none focus:border-blue-500"
                  />
                  <div className="flex bg-slate-950 border border-slate-700 p-0.5 rounded text-xs">
                    <button onClick={() => setStatusFilter('ALL')} className={`px-2 py-0.5 rounded ${statusFilter === 'ALL' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>{t.filterAll}</button>
                    <button onClick={() => setStatusFilter('ACTIVE')} className={`px-2 py-0.5 rounded ${statusFilter === 'ACTIVE' ? 'bg-red-600 text-white' : 'text-slate-400'}`}>{t.filterActive}</button>
                    <button onClick={() => setStatusFilter('RESOLVED')} className={`px-2 py-0.5 rounded ${statusFilter === 'RESOLVED' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>{t.filterResolved}</button>
                  </div>
                  <button
                    onClick={() => window.open(`${API_BASE}/api/alarms/export/pdf?lang=${lang}`, '_blank')}
                    className="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded text-xs font-semibold flex items-center gap-1 transition-colors"
                    title={t.exportPdf}
                  >
                    <span>⬇ {t.exportPdf}</span>
                  </button>
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead className="bg-slate-950 text-slate-400 font-mono uppercase text-[11px] border-b border-slate-800">
                    <tr>
                      <th className="p-3">{t.thPoint}</th>
                      <th className="p-3">{t.thCategory}</th>
                      <th className="p-3">{t.thStart}</th>
                      <th className="p-3">{t.thNotif}</th>
                      <th className="p-3">{t.thResolved}</th>
                      <th className="p-3 text-center">{t.thStatus}</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {filteredEvents.length === 0 ? (
                      <tr>
                        <td colSpan="6" className="p-6 text-center text-slate-500 font-mono">
                          {t.noEvents}
                        </td>
                      </tr>
                    ) : (
                      filteredEvents.map(ev => {
                        const dp = ev.data_point || ev.datapoint;
                        const notif = ev.notifications?.[0] || ev.notification_logs?.[0];
                        const isResolved = ev.status === 'Resuelta' || ev.state === 'Resuelta' || ev.status === 'Resolved' || ev.resolved_at !== null;
                        const startTime = ev.created_at || ev.started_at;
                        const dpAddress = dp?.address || dp?.register_address;

                        return (
                          <tr key={ev.id} className="hover:bg-slate-800/50">
                            <td className="p-3">
                              <strong className="text-slate-200">{dp?.name || `DataPoint #${ev.data_point_id || ev.datapoint_id}`}</strong>
                              <div className="text-[11px] text-slate-400 font-mono">
                                {dp?.protocol} • {dp?.ip_address}:{dpAddress}
                              </div>
                            </td>
                            <td className="p-3">
                              <span className="px-2 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300">
                                {dp?.group?.name || dp?.alarm_group?.name || 'General'}
                              </span>
                            </td>
                            <td className="p-3 font-mono text-slate-300 whitespace-nowrap">
                              {formatDate(startTime, lang)}
                            </td>
                            <td className="p-3 font-mono">
                              {notif ? (
                                <span className={notif.delivery_status === 'delivered' || notif.success ? 'text-emerald-400' : 'text-red-400'}>
                                  {notif.delivery_status === 'delivered' || notif.success ? '✓' : '✗'} {notif.recipient}
                                </span>
                              ) : (
                                <span className="text-slate-500">{t.noNotif}</span>
                              )}
                            </td>
                            <td className="p-3 font-mono whitespace-nowrap">
                              {ev.resolved_at ? (
                                <span className="text-emerald-300">{formatDate(ev.resolved_at, lang)}</span>
                              ) : (
                                <span className="text-amber-400/80 italic">{t.pending}</span>
                              )}
                            </td>
                            <td className="p-3 text-center whitespace-nowrap">
                              {isResolved ? (
                                <span className="px-2.5 py-1 rounded-full text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                                  {t.resolved}
                                </span>
                              ) : (
                                <span className="px-2.5 py-1 rounded-full text-xs bg-red-500/20 text-red-400 border border-red-500/40 font-bold animate-pulse">
                                  {t.filterActive}
                                </span>
                              )}
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
